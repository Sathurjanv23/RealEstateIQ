# render.yaml — RealEstateIQ production services on Render.com
# Deploy: https://dashboard.render.com -> New -> Blueprint -> point to this repo

services:
  # ── Python FastAPI ML Service ────────────────────────────────────────────────
  - type: web
    name: realestate-iq-ml
    env: python
    region: singapore
    plan: free
    buildCommand: cd RealEstateIQ/ml-service && pip install -r requirements.txt
    startCommand: cd RealEstateIQ/ml-service && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"

  # ── Node.js Backend API ─────────────────────────────────────────────────────
  - type: web
    name: realestate-iq-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd RealEstateIQ/backend && npm ci && npm run build
    startCommand: cd RealEstateIQ/backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: ML_SERVICE_URL
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: "info"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

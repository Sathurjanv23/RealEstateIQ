version: '3.9'

services:
  # ── Python ML Service ────────────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: realestate_iq_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      ALLOWED_ORIGINS: "http://localhost:5000,http://backend:5000"
    networks:
      - realestate_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Node.js Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realestate_iq_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: "${MONGO_URI:-mongodb://localhost:27017/realestate_iq}"
      ML_SERVICE_URL: "http://ml-service:8000"
      JWT_SECRET: "${JWT_SECRET:-change-this-in-production}"
      JWT_EXPIRES_IN: "7d"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # SMTP — set in .env file or CI/CD secrets
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      NOTIFICATION_EMAIL: "${NOTIFICATION_EMAIL:-}"
      # Cloudinary — set in .env file or CI/CD secrets
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:-}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:-}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:-}"
    volumes:
      # Persist local uploads when Cloudinary is NOT configured (dev only)
      - backend_uploads:/app/uploads
    depends_on:
      - ml-service
    networks:
      - realestate_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000}"
    container_name: realestate_iq_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:5000}"
    depends_on:
      - backend
    networks:
      - realestate_net

volumes:
  backend_uploads:

networks:
  realestate_net:
    driver: bridge
